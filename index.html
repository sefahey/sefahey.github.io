<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Seamus Fahey Portfolio</title>
<meta name="description" content="Résumé of Seamus Fahey, Economic Research Assistant, Chicago, IL." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,500&family=Source+Sans+3:wght@400;500;600&family=Source+Code+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF7F1;
    --paper-alt:#F1ECE0;
    --ink:#1E2A38;
    --ink-soft:#3B4657;
    --muted:#6B7280;
    --rule:#D9D2C2;
    --rule-strong:#C7BEA6;
    --accent:#A8763E;
    --accent-deep:#7A5A2E;
    --accent2:#3F5D42;
    --max:820px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}

  body{
    margin:0;
    background:var(--paper);
    color:var(--ink-soft);
    font-family:'Source Sans 3', system-ui, sans-serif;
    font-size:16px;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }

  ::selection{ background:var(--accent); color:var(--paper); }

  a{ color:var(--accent-deep); text-decoration:none; border-bottom:1px solid var(--rule-strong); transition:border-color .15s ease, color .15s ease; }
  a:hover{ color:var(--accent); border-color:var(--accent); }

  /* ---------- reading progress ---------- */
  #progress{
    position:fixed; top:0; left:0; height:3px; width:0%;
    background:var(--accent); z-index:100; transition:width .1s linear;
  }

  /* ---------- print button ---------- */
  #printBtn{
    position:fixed; top:22px; right:22px; z-index:90;
    font-family:'Source Code Pro', monospace;
    font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    background:var(--paper); color:var(--ink-soft);
    border:1px solid var(--rule-strong); border-radius:2px;
    padding:8px 12px; cursor:pointer;
  }
  #printBtn:hover{ border-color:var(--accent); color:var(--accent-deep); }

  .wrap{ max-width:var(--max); margin:0 auto; padding:0 28px 100px; }

  /* ---------- masthead ---------- */
  header.masthead{
    max-width:var(--max); margin:0 auto; padding:64px 28px 0;
    text-align:center;
    opacity:0; transform:translateY(8px);
    animation:riseIn .7s ease forwards .1s;
  }
  @keyframes riseIn{ to{ opacity:1; transform:translateY(0); } }

  .kicker{
    font-family:'Source Code Pro', monospace;
    font-size:11px; letter-spacing:.18em; text-transform:uppercase;
    color:var(--muted);
  }
  .kicker .dot{ color:var(--accent); }

  h1.name{
    font-family:'Source Serif 4', serif;
    font-weight:700;
    font-size:clamp(2.2rem, 6vw, 3.1rem);
    letter-spacing:.02em;
    text-transform:uppercase;
    color:var(--ink);
    margin:14px 0 6px;
  }

  .role{
    font-family:'Source Serif 4', serif;
    font-style:italic;
    font-weight:500;
    font-size:1.15rem;
    color:var(--accent-deep);
    margin:0 0 22px;
  }

  .rule-thick{ border:none; border-top:3px solid var(--ink); margin:0; }
  .rule-thin{ border:none; border-top:1px solid var(--rule-strong); margin:3px 0 0; }

  .masthead-meta{
    display:flex; flex-wrap:wrap; justify-content:center; gap:6px 18px;
    font-family:'Source Code Pro', monospace;
    font-size:12px; color:var(--muted);
    padding:14px 0 40px;
  }
  .masthead-meta a{ color:var(--muted); border-color:transparent; }
  .masthead-meta a:hover{ color:var(--accent-deep); border-color:var(--accent-deep); }
  .masthead-meta span.sep{ color:var(--rule-strong); }

  /* ---------- section labels ---------- */
  section{ padding-top:52px; }
  section:first-of-type{ padding-top:44px; }

  .section-label{
    display:flex; align-items:center; gap:12px;
    font-family:'Source Code Pro', monospace;
    font-size:12px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--accent-deep);
    margin-bottom:20px;
  }
  .section-label::after{
    content:''; flex:1; height:1px; background:var(--rule);
  }

  /* ---------- abstract / summary ---------- */
  .abstract{
    font-family:'Source Serif 4', serif;
    font-size:1.18rem;
    line-height:1.75;
    color:var(--ink-soft);
  }
  .abstract::first-letter{
    font-family:'Source Serif 4', serif;
    font-weight:700;
    font-size:3.6em;
    float:left;
    line-height:.85;
    padding:.03em .07em 0 0;
    color:var(--accent);
  }

  /* ---------- experience ---------- */
  .entry{ margin-bottom:34px; }
  .entry:last-child{ margin-bottom:0; }

  .entry-head{
    display:flex; justify-content:space-between; align-items:baseline;
    flex-wrap:wrap; gap:4px 16px;
    border-bottom:1px solid var(--rule);
    padding-bottom:6px; margin-bottom:12px;
  }
  .entry-org{
    font-family:'Source Serif 4', serif;
    font-weight:600;
    font-size:1.18rem;
    color:var(--ink);
  }
  .entry-loc{
    font-family:'Source Code Pro', monospace;
    font-size:12px; color:var(--muted);
  }
  .entry-sub{
    display:flex; justify-content:space-between; align-items:baseline;
    flex-wrap:wrap; gap:4px 16px;
    margin-bottom:10px;
  }
  .entry-title{ font-weight:600; color:var(--ink-soft); font-size:.98rem; }
  .entry-dates{
    font-family:'Source Code Pro', monospace;
    font-size:12px; color:var(--accent-deep);
    white-space:nowrap;
  }

  ul.bullets{ margin:0; padding-left:1.2em; }
  ul.bullets li{ margin-bottom:8px; }
  ul.bullets li:last-child{ margin-bottom:0; }
  ul.bullets li::marker{ color:var(--accent); }

  /* ---------- education ---------- */
  .edu-degree{ font-style:italic; color:var(--ink-soft); margin:2px 0 8px; }

  /* ---------- publications ---------- */
  .citations{ counter-reset:cite; padding:0; margin:0; list-style:none; }
  .citations li{
    counter-increment:cite;
    position:relative;
    padding-left:2.4em;
    margin-bottom:16px;
    font-size:.95rem;
    color:var(--ink-soft);
  }
  .citations li::before{
    content:'[' counter(cite) ']';
    position:absolute; left:0; top:0;
    font-family:'Source Code Pro', monospace;
    font-size:.85rem;
    color:var(--accent-deep);
  }
  .citations .venue{ font-style:italic; }

  /* ---------- skills ---------- */
  .skill-block{ margin-bottom:22px; }
  .skill-block:last-child{ margin-bottom:0; }
  .skill-block h3{
    font-family:'Source Code Pro', monospace;
    font-size:11px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--muted); font-weight:500; margin:0 0 10px;
  }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    font-family:'Source Code Pro', monospace;
    font-size:12.5px; color:var(--ink-soft);
    background:var(--paper-alt);
    border:1px solid var(--rule);
    border-radius:2px;
    padding:5px 10px;
  }

  /* ---------- colophon ---------- */
  footer.colophon{
    max-width:var(--max); margin:70px auto 0; padding:26px 28px 0;
    border-top:1px solid var(--rule);
    text-align:center;
  }
  footer.colophon p{
    font-family:'Source Code Pro', monospace;
    font-size:11px; letter-spacing:.05em;
    color:var(--muted); margin:0 0 4px;
  }
  footer.colophon a{ color:var(--muted); border-color:transparent; }
  footer.colophon a:hover{ color:var(--accent-deep); border-color:var(--accent-deep); }

  @media (max-width:560px){
    .entry-head, .entry-sub{ flex-direction:column; gap:2px; }
    .abstract::first-letter{ font-size:3.1em; }
  }

  @media print{
    #progress, #printBtn{ display:none !important; }
    body{ background:#fff; color:#000; font-size:11.5pt; }
    a{ color:#000; border-color:#999; }
    .wrap{ padding-bottom:20px; }
    header.masthead{ animation:none; opacity:1; transform:none; padding-top:0; }
    .accent, h1.name, .role, .section-label, .entry-dates{ color:#000 !important; }
    section{ padding-top:26px; }
  }

  @media (prefers-reduced-motion: reduce){
    header.masthead{ animation:none; opacity:1; transform:none; }
    html{ scroll-behavior:auto; }
  }
</style>
</head>
<body>

<div id="progress"></div>
<button id="printBtn" onclick="window.print()">Print / Save PDF</button>

<header class="masthead">
  <h1 class="name">Seamus Fahey</h1>
  <p class="role">Economic Research Assistant</p>
  <hr class="rule-thick" />
  <hr class="rule-thin" />
  <div class="masthead-meta">
    <a href="mailto:sefahey1@outlook.com">Email</a>
    <span class="sep">&diamond;</span>
    <span>Chicago, IL</span>
    <span class="sep">&diamond;</span>
    <a href="https://www.linkedin.com/in/sefahey1/" target="_blank" rel="noopener">LinkedIn Profile</a>
    <span class="sep">&diamond;</span>
    <a href="resume.html">Experience</a>
    <span class="sep">&diamond;</span>
    <a href="writing.html">Writing Samples</a>
    <span class="sep">&diamond;</span>
    <a href="outputs.html">Outputs</a>
  </div>
</header>

</body>
</html>
